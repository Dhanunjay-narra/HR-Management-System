apiVersion: apps/v1
kind: Deployment
metadata:
  name: peoplepulse-frontend
  namespace: peoplepulse
  labels:
    app: peoplepulse-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: peoplepulse-frontend
  template:
    metadata:
      labels:
        app: peoplepulse-frontend
    spec:
      containers:
        - name: frontend
          image: peoplepulse-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: peoplepulse
spec:
  type: LoadBalancer
  selector:
    app: peoplepulse-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
